[project]
name = "wirex-baas-skills-tests"
version = "0.0.0"
description = "Test suite for Wirex BaaS Agent Skills"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-timeout>=2.0",
    "pytest-xdist>=3.0",
    "skills-ref>=0.1.1",
    "pyyaml>=6.0",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["."]
markers = [
    "ai: AI-in-the-loop evals (require claude CLI, cost money)",
]
